[project]
name = "payments-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "snowflake-connector-python>=3.12",
]

[tool.pytest.ini_options]
# Raised inside the connector's vendored urllib3, not actionable here
filterwarnings = ["ignore:X509.get_subject is deprecated:DeprecationWarning"]

[tool.uv]
package = false
